<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>10クリック速度測定</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>10クリック速度測定</h1>
      <p id="statusText" class="status">ボタンを押して計測を開始</p>
      <p id="countText" class="count">0 / 10</p>

      <button id="tapButton" class="tap-button" type="button">
        ここを10回クリック / タップ
      </button>

      <section class="result" aria-live="polite">
        <h2>結果</h2>
        <dl>
          <div><dt>合計時間</dt><dd id="totalMs">-</dd></div>
          <div><dt>合計時間（秒）</dt><dd id="totalSec">-</dd></div>
          <div><dt>CPS</dt><dd id="cps">-</dd></div>
          <div><dt>平均間隔</dt><dd id="avgInterval">-</dd></div>
        </dl>
      </section>

      <div class="actions">
        <button id="retryButton" type="button" class="retry-button">リトライ</button>
      </div>

      <section class="history">
        <h2>直近5件の履歴</h2>
        <ul id="historyList">
          <li>履歴はまだありません</li>
        </ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
